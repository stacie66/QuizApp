# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Add these steps to set up Flutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'  # You can specify your Flutter version or use 'stable'
          channel: 'stable'
      - run: flutter config --enable-web
      - run: flutter pub get
      
      # Now build the web app
      - run: flutter build web
      
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLASHCARDS_D8007 }}
          channelId: live
          projectId: flashcards-d8007
